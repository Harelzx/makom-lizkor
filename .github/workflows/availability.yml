# Independent of the site's Worker and Gmail transport. The public check holds no credentials; the resources check holds
# one read-only token (Account Analytics: Read), given to its one step, and installs nothing.
name: availability
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-availability
  cancel-in-progress: false
jobs:
  public:
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/public-smoke.mjs
  resources:
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/worker-limits.mjs
        env:
          CF_ANALYTICS_READ: ${{ secrets.CF_ANALYTICS_READ }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  # A failure above reaches the owner's phone too (ntfy), beside GitHub's own mail: the topic, a title and a link to the run.
  notify:
    needs: [public, resources]
    if: failure()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          jq -n --arg topic "$NTFY_TOPIC" --arg click "$RUN" '{topic: $topic, title: "מקום לזכור: בדיקת הזמינות נכשלה", message: "האתר, גבול הפרטיות או עצירות השרת. הפרטים בריצה.", tags: ["warning"], click: $click}' | curl -fsS -m 15 -H "content-type: application/json" --data-binary @- https://ntfy.sh/ > /dev/null
