# Readiness for protected synthetic staging. Unknown/sensitive changes require full regression here;
# allowlisted presentation changes get core + affected tests here, and full regression in regression.yml.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      groups: ${{ steps.plan.outputs.groups }}
      dev: ${{ steps.plan.outputs.dev }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-evidence.mjs plan
      - uses: actions/upload-artifact@v7
        with:
          name: ci-plan
          path: ci-plan.json
          retention-days: 7
  static:
    needs: plan
    if: needs.plan.outputs.mode != 'docs'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run security:deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:scripts
      - run: npm run check:access
      - run: node scripts/ci-policy.mjs
      - run: npm run build
      - run: node scripts/bundle-check.mjs
  worker:
    runs-on: ubuntu-26.04
    needs: plan
    if: needs.plan.outputs.mode != 'docs'
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
  client:
    needs: plan
    if: needs.plan.outputs.mode != 'docs'
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:client
  core:
    needs: [plan, static, worker, client]
    if: needs.plan.outputs.mode == 'preview'
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - env:
          CI_GROUPS: ${{ needs.plan.outputs.groups }}
        run: node scripts/ci-browser.mjs run core
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-core
          path: ci-results/
          retention-days: 7
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-core
          path: test-results/
          retention-days: 7
  webkit:
    needs: [plan, static, worker, client]
    if: needs.plan.outputs.mode != 'docs'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 10
      - run: node scripts/ci-browser.mjs run webkit
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-webkit
          path: ci-results/
          retention-days: 7
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-webkit
          path: test-results/
          retention-days: 7
  dev:
    needs: [plan, static, worker, client]
    if: needs.plan.outputs.dev == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - run: node scripts/ci-browser.mjs run dev
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-dev
          path: ci-results/
          retention-days: 7
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-dev
          path: test-results/
          retention-days: 7
  regression:
    needs: [plan, static, worker, client]
    if: needs.plan.outputs.mode == 'full'
    uses: ./.github/workflows/browser-suite.yml
    with:
      sha: ${{ github.sha }}
  ready:
    if: always()
    needs: [plan, static, worker, client, core, webkit, dev, regression]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: ci-plan
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-evidence.mjs ready
      - uses: actions/upload-artifact@v7
        with:
          name: ci-ready-${{ github.sha }}
          path: ci-evidence/ready/receipt.json
          retention-days: 90
          if-no-files-found: error
      - if: needs.plan.outputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: ci-full-${{ github.sha }}
          path: ci-evidence/full/receipt.json
          retention-days: 90
          if-no-files-found: error
