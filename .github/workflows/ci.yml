# Each commit on main, and each pull request: the static checks, the Worker's and the browser code's tests, the scripts' tests, the
# access registry and the workflow policy, then the browser suite on the dev server. No environment and no secrets:
# CI never reaches production (spec 12.2), and scripts/ci-policy.mjs fails the run if a change makes it.
name: ci

# One run per commit: pushes to main, and pull requests (a branch's push isn't run again). GitHub Free's minutes are
# the budget; staging.yml follows a passing run on main instead of building again.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:scripts
      - run: npm run check:access
      - run: node scripts/ci-policy.mjs
      # No curated record in what would ship (Phase 7 task 6).
      - run: npm run build
      - run: node scripts/bundle-check.mjs

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:client

  e2e:
    needs: [static, worker, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Every spec but the frame-rate check: it measures the machine as much as the code, and this runner (no GPU) has
      # not been established as giving valid performance evidence (main's first run, 2026-10-07: 3.4 long frames a
      # second against 0.95). It runs, unchanged, on a suitable machine as its own stage (agent-evidence stages.sh
      # perf-dev, perf-prod); finding P1 and its launch obligation stay open there.
      # The panel's motion check (a spring, not a snap) runs below against the production build instead: on this runner the
      # dev server's React development runtime made its samples unsuitable (two CI failures, each a stall and a catch-up;
      # locally the production build kept the same scenario within its bound at 1x to 6x CPU; CI-MOTION-1, a99).
      # (The | below is the pattern's alternation, not a pipe; pipefail keeps ci-policy's pipe rule satisfied regardless.)
      - run: |
          set -o pipefail
          npm run e2e -- --grep-invert "keeps the frame rate|collapses and opens again without losing its rounded corners"
      - run: npm run e2e:prod -- e2e/panel.spec.ts -g "collapses and opens again without losing its rounded corners"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
