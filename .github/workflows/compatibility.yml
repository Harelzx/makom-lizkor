# Broader accessibility checks once a week, only if this commit has not already passed them. No cloud credentials.
name: compatibility
on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility
  cancel-in-progress: true
jobs:
  changed:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow compatibility.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$previous" -eq 0 ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; else echo 'run=false' >> "$GITHUB_OUTPUT"; fi
  browsers:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
        timeout-minutes: 10
      - run: node scripts/ci-browser.mjs run compatibility
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-compatibility
          path: ci-results/
          retention-days: 7
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-compatibility
          path: test-results/
          retention-days: 7
