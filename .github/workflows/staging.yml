# Staging (spec 14.1, 14.2): every commit on main that passed CI is deployed to the staging account, synthetic data
# only, on its workers.dev address behind Cloudflare Access, and checked there. Its last step uploads a receipt named
# for the commit it deployed; release.yml requires that receipt, from a successful run, with a passed edge check.
#
# GitHub Free, private repository: no environment secrets, no required reviewers, no deployment branches (GitHub docs,
# 2026-10-06). So the staging credentials are repository secrets, readable by any workflow on any branch: they must
# be scoped to the staging account alone, which holds nothing but synthetic data. Production credentials never go into
# this repository's secrets (scripts/ci-policy.mjs keeps their names out of every workflow but release and rollback).
name: staging

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    # Only a push to main that CI passed: never a pull request's run, never a failed one.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      CLOUDFLARE_ENV: staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
      VITE_TURNSTILE_SITEKEY: ${{ vars.STAGING_TURNSTILE_SITEKEY }}
      STAGING_ACCESS_TEAM_DOMAIN: ${{ vars.STAGING_ACCESS_TEAM_DOMAIN }}
      STAGING_ACCESS_AUD: ${{ vars.STAGING_ACCESS_AUD }}
      STAGING_PUBLIC_ORIGIN: ${{ vars.STAGING_PUBLIC_ORIGIN }}
      STAGING_TURNSTILE_HOSTNAMES: ${{ vars.STAGING_TURNSTILE_HOSTNAMES }}
      STAGING_MODERATORS: ${{ vars.STAGING_MODERATORS }}
      # The synthetic machine moderator's service token client id (H1); unset, there is none and nothing changes.
      STAGING_MODERATOR_SERVICE_TOKENS: ${{ vars.STAGING_MODERATOR_SERVICE_TOKENS }}
      # The purge probe's service token client id (L-PURGE); unset, the probe refuses everyone.
      STAGING_PROBE_SERVICE_TOKENS: ${{ vars.STAGING_PROBE_SERVICE_TOKENS }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: The commit checked out is the one CI passed
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Staging config holds, with the real database id and every account value
        run: node scripts/staging-check.mjs --deploy
      - run: npm run build
      - run: node scripts/bundle-check.mjs
      - name: Migrations, on the staging database
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy, tagged with its commit
        env:
          TURNSTILE_SECRET: ${{ secrets.STAGING_TURNSTILE_SECRET }}
          TRACKING_SECRET: ${{ secrets.STAGING_TRACKING_SECRET }}
          TRIBUTE_SECRET: ${{ secrets.STAGING_TRIBUTE_SECRET }}
        run: |
          set -euo pipefail
          secrets="$RUNNER_TEMP/staging-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          node -e 'const e=process.env; require("fs").writeFileSync(process.argv[1], JSON.stringify({TURNSTILE_SECRET:e.TURNSTILE_SECRET, TRACKING_SECRET:e.TRACKING_SECRET, TRIBUTE_SECRET:e.TRIBUTE_SECRET}), {mode:0o600})' "$secrets"
          npx wrangler deploy --tag "staging-${SHA:0:12}" --message "staging $SHA" --secrets-file "$secrets" \
            --var "ACCESS_TEAM_DOMAIN:$STAGING_ACCESS_TEAM_DOMAIN" --var "ACCESS_AUD:$STAGING_ACCESS_AUD" \
            --var "PUBLIC_ORIGIN:$STAGING_PUBLIC_ORIGIN" --var "TURNSTILE_HOSTNAMES:$STAGING_TURNSTILE_HOSTNAMES" \
            --var "MODERATORS:$STAGING_MODERATORS" --var "MODERATOR_SERVICE_TOKENS:$STAGING_MODERATOR_SERVICE_TOKENS" \
            --var "PROBE_SERVICE_TOKENS:$STAGING_PROBE_SERVICE_TOKENS"
      # It first waits, bounded, for the version just deployed (its tag) and holds every Worker answer to it (a61).
      # Through Access with the service token; the same address probed without it must be refused (Access closes this
      # workers.dev address). The synthetic owners, the named place and the purge exercise come from the repository;
      # any of them unset leaves its check incomplete. Exit 3, incomplete, keeps the deploy and says so in the receipt;
      # a release accepts only a receipt whose every check passed (a51, P6-EDGE-1).
      - name: Edge checks through Access
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.STAGING_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_ACCESS_CLIENT_SECRET }}
          EDGE_IDENTITIES: ${{ secrets.STAGING_EDGE_IDENTITIES }}
          EDGE_PLACE: ${{ vars.STAGING_EDGE_PLACE }}
          EDGE_PURGE: ${{ secrets.STAGING_EDGE_PURGE }}
          # The purge probe's own Access pair (L-PURGE): checked as purge_probe beside the exercise; unset, not run.
          EDGE_PROBE: ${{ secrets.STAGING_EDGE_PROBE }}
        run: |
          set -uo pipefail
          status=0
          node scripts/edge-check.mjs "$STAGING_PUBLIC_ORIGIN" --expect-tag "staging-${SHA:0:12}" --workers-dev "$STAGING_PUBLIC_ORIGIN" --report "$RUNNER_TEMP/edge.json" || status=$?
          test "$status" -eq 0 -o "$status" -eq 3
      - name: The receipt for this commit's deploy and checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipt"
          node scripts/staging-receipt.mjs "$RUNNER_TEMP/edge.json" > "$RUNNER_TEMP/receipt/receipt.json"
      # Last, so it exists only if every step before it passed; release.yml reads it (scripts/staging-evidence.mjs).
      - uses: actions/upload-artifact@v4
        with:
          name: staging-receipt-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/receipt/receipt.json
          retention-days: 90
