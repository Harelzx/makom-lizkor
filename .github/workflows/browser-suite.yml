# Reusable full regression: one browser per machine, a fresh database per shard, and exact merged coverage.
name: browser-suite
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Full production-build regression
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci-browser.mjs run full "$SHARD/2"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-full-${{ matrix.shard }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-full-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
  coverage:
    if: always()
    needs: browser
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Both shards passed
        env:
          RESULT: ${{ needs.browser.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: browser-full-*
          path: ci-results
      - run: node scripts/ci-browser.mjs verify-full
