# A release to production (spec 14.2). The agent prepares a draft GitHub release whose target is one commit, with the
# manifest attached (manifest.json, from scripts/release-manifest.mjs); the owner reads it and runs this workflow with
# the release's tag. That is the only manual step. Everything below names that one commit: the manifest is rebuilt
# for it and compared whole, CI and staging must have passed on it, and it is what is checked out, checked and deployed (a49).
#
# release:check gates this path; it does not by itself stop a deploy made some other way (a49).
#
# Not usable as it stands on GitHub Free with a private repository (GitHub docs, 2026-10-06): the production environment
# there holds no secrets and enforces no reviewer or branch rule, and workflow_dispatch is no human-approval boundary.
# Production credentials are therefore kept out of GitHub entirely, so this workflow can't deploy until the owner
# chooses the production release path; it fails closed (no credentials, and no staging.yml run on the commit).
name: release
# Named for its release, so a rollback finds each attempt's own record (release-attempt-<release>-<attempt>).
run-name: release ${{ inputs.release }}

on:
  workflow_dispatch:
    inputs:
      release:
        description: "The draft release's tag, e.g. release-2026-11-02"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.bind.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ inputs.release }}
    steps:
      - name: Runs from main only
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: The draft release names one commit on main
        id: bind
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^release-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]+)?$ ]]
          test "$(gh release view "$RELEASE" --json isDraft --jq .isDraft)" = "true"
          sha=$(gh release view "$RELEASE" --json targetCommitish --jq .targetCommitish)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: CI passed on that commit
        env:
          SHA: ${{ steps.bind.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(gh run list --workflow ci.yml --commit "$SHA" --status success --json databaseId --jq length)" -gt 0
      # Staging's receipt for this commit, from a completed, successful staging.yml run, with its edge check passed. A
      # run's own head_sha is not read: for a workflow_run trigger it is main's tip, not the commit deployed (a51).
      - name: Staging passed on that commit
        env:
          SHA: ${{ steps.bind.outputs.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=staging-receipt-$SHA" > "$RUNNER_TEMP/artifacts.json"
          run=$(node scripts/staging-evidence.mjs run-id "$SHA" "$RUNNER_TEMP/artifacts.json")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "$RUNNER_TEMP/run.json"
          gh run download "$run" --name "staging-receipt-$SHA" --dir "$RUNNER_TEMP/receipt"
          node scripts/staging-evidence.mjs check "$SHA" "$RUNNER_TEMP/artifacts.json" "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/receipt/receipt.json"
      - name: The attached manifest is this commit's
        env:
          SHA: ${{ steps.bind.outputs.sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$SHA"
          previous=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
          from=""
          if [ -n "$previous" ]; then from=$(git rev-list -n 1 "$previous"); fi
          gh release download "$RELEASE" --pattern manifest.json --dir "$RUNNER_TEMP"
          # The attachment compared field by field with the one rebuilt here, and an existing release tag must name
          # this commit (a51, P6-MANIFEST-1).
          node scripts/release-manifest.mjs "$SHA" $from --verify "$RUNNER_TEMP/manifest.json" --tag "$RELEASE"

  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      SHA: ${{ needs.verify.outputs.sha }}
      RELEASE: ${{ inputs.release }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: The commit checked out is the one verified
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Release check
        run: npm run release:check
      # Before anything changes production: which commit this attempt releases, so a later rollback knows what a
      # failed attempt may have migrated or deployed (scripts/rollback-state.mjs; a51, P6-ROLLBACK-1).
      - name: Record this attempt
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/attempt"
          node -e 'console.log(JSON.stringify({ release: process.env.RELEASE, sha: process.env.SHA }))' > "$RUNNER_TEMP/attempt/attempt.json"
      - uses: actions/upload-artifact@v4
        with:
          # One per attempt, a rerun's included; kept as long as a private repository allows (a52).
          name: release-attempt-${{ inputs.release }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attempt/attempt.json
          retention-days: 400
      # Built and searched for curated records before anything in production changes, after the attempt is recorded (Phase 7
      # task 6): a check that fails here leaves a record, so a later rollback still knows this attempt changed nothing.
      - run: npm run build
      - run: node scripts/bundle-check.mjs
      # Without pipefail (GitHub's default `bash -e`), a failed command before tee would pass and the migrations would
      # run with no recovery point (a51, P6-BOOKMARK-1).
      - name: Time Travel bookmark before the migrations
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info DB | tee "$RUNNER_TEMP/bookmark.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: bookmark-${{ inputs.release }}
          path: ${{ runner.temp }}/bookmark.txt
          retention-days: 30
      - name: Migrations (expand only; scripts/rollback-check.mjs refuses a rollback across anything else)
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy, the version tagged with the release and its commit
        run: npx wrangler deploy --tag "$RELEASE" --message "release $RELEASE $SHA"
      - name: Production checks
        run: node scripts/edge-check.mjs "$PUBLIC_ORIGIN"
      - name: Publish the release, which notifies the owner
        run: gh release edit "$RELEASE" --draft=false
