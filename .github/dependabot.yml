version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A new release waits a week before it is proposed: a hijacked package is usually caught and pulled within days.
    # Security updates are never held (cooldown applies to version updates only).
    cooldown:
      default-days: 7
    groups:
      cloudflare-toolchain:
        patterns: ["@cloudflare/*", "wrangler"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
