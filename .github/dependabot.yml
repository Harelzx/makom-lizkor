version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A new release waits a week before it is proposed: a hijacked package is usually caught and pulled within days.
    # Security updates are never held (cooldown applies to version updates only).
    cooldown:
      default-days: 7
    # TypeScript 7 (the Go compiler) has no JavaScript API yet, and typescript-eslint needs one (peer <6.1.0 in 8.71).
    # Lift this when typescript-eslint supports it: https://github.com/typescript-eslint/typescript-eslint/issues/12518
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # vitest moves with the Workers pool that runs it: 5.0.4 alone broke every suite in workerd (its new cache file
      # was never written there), so the two are proposed, and tested, together.
      cloudflare-toolchain:
        patterns: ["@cloudflare/*", "wrangler", "vitest", "@vitest/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
